augmentation:
  enabled: true
dataset:
  input_shape:
  - 3
  - 32
  - 32
  name: CIFAR10
  num_classes: 10
  path: data/cifar-10
  test_transform:
  - normalize
  train_transform:
  - random_crop
  - random_flip
  - normalize
llm:
  api_key: 
  max_tokens: 4096
  model: deepseek-chat
  temperature: 0.2
logging:
  log_dir: cifar10_log/baseline_20250724_122728
  metrics:
  - loss
  - accuracy
  - precision
  - recall
  plot_metrics: true
  save_interval: 1
  save_plots: true
model:
  architecture:
    conv_layers:
    - filters: 16
      kernel_size: 3
      padding: 1
      stride: 1
    - filters: 32
      kernel_size: 3
      padding: 1
      stride: 1
    - filters: 64
      kernel_size: 3
      padding: 1
      stride: 1
    dropout: 0.4
    fc_layers:
    - 128
    pool_size: 2
  name: SimpleCNN
training:
  batch_size: 128
  device: auto
  early_stopping_patience: 5
  epochs: 10
  learning_rate: 0.001
  loss_function: focal
  optimizer: adamw
  tunable_params:
  - learning_rate
  - weight_class_0
  - weight_class_1
  - weight_class_2
  - weight_class_3
  - weight_class_4
  - weight_class_5
  - weight_class_6
  - weight_class_7
  - weight_class_8
  - weight_class_9
  validation_split: 0.1
