augmentation:
  enabled: true
  methods:
  - gaussian_noise
  - feature_dropout
  - shift
  - none
dataset:
  input_dim: 9
  name: WaterQuality
  num_classes: 2
  path: data/water_quality/water_potability.csv
  validation_split: 0.2
llm:
  api_key: sk-b295897df8d7404a87a1ae9565e33bab
  max_tokens: 4096
  model: deepseek-chat
  request_timeout: 60
  temperature: 0.2
logging:
  log_dir: logs/_water_baseline_20250724_114537
  metrics:
  - loss
  - accuracy
  - precision
  - recall
  plot_metrics: true
  save_interval: 1
  save_plots: true
model:
  architecture:
    dropout: 0.3
    hidden_dims:
    - 128
    - 256
  name: CustomModel
training:
  batch_size: 256
  class_weights:
    0: 1.0
    1: 1.0
  device: auto
  early_stopping_patience: 5
  epochs: 10
  learning_rate: 0.001
  loss_function: cross_entropy
  optimizer: adamw
  seed: 42
  tunable_params:
  - learning_rate
  - weight_class_0
  - weight_class_1
