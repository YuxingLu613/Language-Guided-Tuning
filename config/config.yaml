# 数据集配置
dataset:
  name: "MNIST"
  input_shape: [1, 28, 28]  # [channels, height, width]
  num_classes: 10
  path: "data/"
  train_transform:
    - "normalize"
  test_transform:
    - "normalize"

# 模型配置
model:
  name: "SimpleCNN"
  architecture:
    conv_layers:
      - filters: 8
        kernel_size: 3
        stride: 1
        padding: 1
      - filters: 8
        kernel_size: 3
        stride: 1
        padding: 1
    pool_size: 2
    fc_layers: [64]
    dropout: 0.25

# 训练配置
training:
  batch_size: 256  # 增加批次大小以提高训练速度
  learning_rate: 0.001
  optimizer: "sgd"
  epochs: 10
  early_stopping_patience: 5
  validation_split: 0.2
  device: "auto"
  loss_function: "nll"
  
  # 可调整的超参数
  tunable_params:
    - "learning_rate"
    - "weight_class_0"
    - "weight_class_1"
    - "weight_class_2"
    - "weight_class_3"
    - "weight_class_4"
    - "weight_class_5"
    - "weight_class_6"
    - "weight_class_7"
    - "weight_class_8"
    - "weight_class_9"
  
  # 类别权重初始值
  class_weights:
    0: 1.0
    1: 1.0
    2: 1.0
    3: 1.0
    4: 1.0
    5: 1.0
    6: 1.0
    7: 1.0
    8: 1.0
    9: 1.0

# LLM配置
llm:
  model: "deepseek-chat"
  api_key: "sk-b295897df8d7404a87a1ae9565e33bab"
  temperature: 0.2  # 降低温度使输出更确定性
  max_tokens: 4096  # 增加token限制以确保完整输出
  
# 日志配置
logging:
  log_dir: "logs/"
  save_interval: 1
  metrics:
    - "loss"
    - "accuracy"
    - "precision"
    - "recall"
  plot_metrics: true  # 是否绘制指标图表
  save_plots: true  # 是否保存图表 

  augmentation:
  enabled: true        # 开启增强循环
  samples_per_epoch: 64  # 每轮向 LLM 索要多少合成样本