augmentation:
  enabled: true
  methods:
  - gaussian_noise
  - feature_dropout
  - none
dataset:
  input_dim: 11
  name: WineQuality
  path: data/winequality/winequality-red.csv
  target_scale: 10.0
  validation_split: 0.2
llm:
  api_key: 
  max_tokens: 4096
  model: deepseek-chat
  temperature: 0.2
logging:
  log_dir: logs/_wine_hpo_20250727_190743
  metrics:
  - loss
  - mse
  - mae
  plot_metrics: true
  save_interval: 1
  save_plots: true
model:
  architecture:
    dropout: 0.3
    hidden_dims:
    - 32
    - 16
  name: CustomModel
training:
  batch_size: 256
  device: auto
  early_stopping_patience: 5
  epochs: 4
  learning_rate: 0.001
  loss_function: mae
  optimizer: adam
  seed: 42
  tunable_params:
  - learning_rate
  - dropout
