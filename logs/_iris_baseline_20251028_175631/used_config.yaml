augmentation:
  enabled: true
dataset:
  input_dim: 4
  name: Iris
  num_classes: 3
  path: sklearn
  validation_split: 0.2
llm:
  api_key: ''
  max_tokens: 4096
  model: deepseek-chat
  temperature: 0.2
logging:
  log_dir: logs/_iris_baseline_20251028_175631
  metrics:
  - loss
  - accuracy
  - precision
  - recall
  plot_metrics: true
  save_interval: 1
  save_plots: true
model:
  architecture:
    dropout: 0.3
    hidden_dims:
    - 16
    - 16
  name: CustomModel
training:
  batch_size: 32
  class_weights:
    0: 1.0
    1: 1.0
    2: 1.0
  device: auto
  early_stopping_patience: 10
  epochs: 10
  learning_rate: 0.005
  loss_function: cross_entropy
  optimizer: sgd
  seed: 42
  tunable_params:
  - learning_rate
