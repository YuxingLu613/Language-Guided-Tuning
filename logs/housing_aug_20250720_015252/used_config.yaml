augmentation:
  enabled: true
  methods:
  - gaussian_noise
  - feature_dropout
  - none
dataset:
  input_dim: 5
  name: Housing
  path: data/housing/Housing.csv
  validation_split: 0.2
llm:
  api_key: sk-b295897df8d7404a87a1ae9565e33bab
  max_tokens: 4096
  model: deepseek-chat
  temperature: 0.2
logging:
  log_dir: C:\Users\24710\Desktop\llm+deeplearning\Language-Guided-Tuning\logs\housing_aug_20250720_015252
  metrics:
  - loss
  - mse
  - mae
  plot_metrics: true
  save_interval: 1
  save_plots: true
model:
  architecture:
    dropout: 0.3
    hidden_dims:
    - 64
    - 32
  name: CustomModel
training:
  batch_size: 256
  device: auto
  early_stopping_patience: 5
  epochs: 3
  learning_rate: 0.0005
  loss_function: huber
  optimizer: sgd
  seed: 42
  tunable_params:
  - learning_rate
  - dropout
