augmentation:
  enabled: true
  methods:
  - gaussian_noise
  - feature_dropout
  - none
dataset:
  input_dim: 5
  name: Housing
  path: data/housing/Housing.csv
  validation_split: 0.2
llm:
  api_key: sk-b295897df8d7404a87a1ae9565e33bab
  max_tokens: 4096
  model: deepseek-chat
  temperature: 0.2
logging:
  log_dir: logs/_housing_baseline_20250719_181800
  metrics:
  - loss
  - mse
  - mae
  plot_metrics: true
  save_interval: 1
  save_plots: true
model:
  architecture:
    dropout: 0.1
    hidden_dims:
    - 8
    - 4
  name: CustomModel
training:
  batch_size: 256
  device: auto
  early_stopping_patience: 5
  epochs: 10
  learning_rate: 0.001
  loss_function: huber
  optimizer: sgd
  seed: 42
  tunable_params:
  - learning_rate
  - dropout
